[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kws"
version = "0.1.0"
description = "Deterministic keyword spotting: weighted MFCC fingerprinting + Levenshtein"
authors = [{ name = "Didus/Tereikovskyi" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "pydub>=0.25.1",
  "python_speech_features>=0.6",
  "scikit-learn>=1.3",
]

[project.scripts]
kws = "kws.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


